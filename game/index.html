<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOIDLIGHT — a neon arena survival game</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='26,16 8,26 12,16 8,6' fill='%232ee6ff'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #02030a;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  #wrap {
    position: relative;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #04050d;
    cursor: crosshair;
  }
  #hint {
    position: absolute;
    left: 50%;
    bottom: 10px;
    transform: translateX(-50%);
    color: rgba(160, 200, 255, 0.35);
    font-size: 11px;
    letter-spacing: 0.12em;
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="hint">WASD MOVE &nbsp;·&nbsp; MOUSE AIM &nbsp;·&nbsp; HOLD CLICK FIRE &nbsp;·&nbsp; SPACE DASH &nbsp;·&nbsp; M MUTE</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
